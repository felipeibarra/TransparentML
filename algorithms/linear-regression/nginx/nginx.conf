events {
    worker_connections 1024;
}

http {
    upstream prediction_api {
        server prediction-api:8000;
    }

    upstream jupyter_lab {
        server jupyter-lab:8888;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=jupyter_limit:10m rate=5r/s;

    server {
        listen 80;
        server_name localhost;

        # API de Predicción
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://prediction_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # JupyterLab
        location /jupyter/ {
            limit_req zone=jupyter_limit burst=10 nodelay;
            
            proxy_pass http://jupyter_lab/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts for Jupyter
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirect root to API docs
        location = / {
            return 301 /api/docs;
        }

        # Error pages
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            return 503 "Service temporarily unavailable";
            add_header Content-Type text/plain;
        }
    }
}
