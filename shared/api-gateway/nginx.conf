events {
    worker_connections 1024;
}

http {
    upstream linear_regression {
        server linear-regression-api:8000;
    }

    upstream pca {
        server pca-api:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Linear Regression API
        location /api/linear-regression/ {
            proxy_pass http://linear_regression/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # PCA API
        location /api/pca/ {
            proxy_pass http://pca/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Root endpoint
        location / {
            return 200 '{"message": "TransparentML API Gateway", "services": ["/api/linear-regression", "/api/pca"]}';
            add_header Content-Type application/json;
        }
    }
}
